[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capkit"
version = "0.2.0"
description = "Read CAN bus capture logs in different formats into one common frame stream"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "André Delgado", email = "andre@adelgado.io" }]
keywords = ["CAN", "canbus", "log", "kvaser", "automotive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://canforge.io/capkit"
Repository = "https://github.com/canforge/capkit"
Changelog = "https://github.com/canforge/capkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build",
    "dbckit>=1.0",   # test-only: exercises the optional entry-point integration tests
    "mypy",
    "python-can>=4.6",  # test-only: reference reader/writer cross-checks
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[project.entry-points."dbckit.readers"]
asc = "capkit.readers.vector_asc:VectorAscReader"
log = "capkit.integration:DispatchReader"
txt = "capkit.integration:DispatchReader"

[tool.hatch.build.targets.wheel]
packages = ["capkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["capkit"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
